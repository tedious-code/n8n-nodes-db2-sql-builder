volumes:
  n8n_storage:

networks:
  n8n-local:

services:
  n8n:
    image: 5nickels/n8n-nodes-db2-sql-builder:latest
    container_name: n8n-db2
    build:
      context: .
      dockerfile: Dockerfile
      args:
        N8N_VERSION: ${N8N_VERSION:-2.32.6}
    networks: [n8n-local]
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    platform: linux/amd64
    restart: unless-stopped
    environment:
      N8N_PORT: "5678"
      PORT: "5678"
      N8N_CUSTOM_EXTENSIONS: /opt/n8n-custom
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "true"
      DB_TYPE: ${DB_TYPE:-sqlite}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
    env_file:
      - path: .env
        required: false
    # Optional Postgres / secrets: set in .env (see .env.example). Do not commit secrets.
    volumes:
      # Persist n8n data only; custom node stays at /opt/n8n-custom (not shadowed)
      - n8n_storage:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
